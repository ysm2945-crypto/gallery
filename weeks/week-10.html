<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취향 갤러리 10주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 디자인 시스템: achievable.info 추출 — 24컬럼 · 16px 거터 · 350 굵기 · 음수 자간 · 흑백 + 웜그레이 · 직각 · 모서리 마크 */
  :root { color-scheme: light; --ground: #fcfcfc; --ink: #000000; --muted: #646464; --line: #d8d7d4; --soft: #efeeec; --thumb: #d9d4cc; --btn: #202020; --accent: #00ff00; --mar: 16px; }
  @media (min-width: 900px) { :root { --mar: 24px; } }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --ground: #101010; --ink: #fcfcfc; --muted: #9c9c9c; --line: #2c2c2c; --soft: #1a1a1a; --thumb: #c9c4bc; --btn: #fcfcfc; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #101010; --ink: #fcfcfc; --muted: #9c9c9c; --line: #2c2c2c; --soft: #1a1a1a; --thumb: #c9c4bc; --btn: #fcfcfc; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 var(--mar) 96px; background: var(--ground); color: var(--ink); font: 400 16px/1.55 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-style: normal; letter-spacing: -0.02em; word-break: keep-all; -webkit-font-smoothing: antialiased; position: relative; }
  body::before, body::after { content: ""; position: fixed; top: 0; bottom: 0; width: 1px; background: var(--line); pointer-events: none; opacity: .7; }
  body::before { left: var(--mar); }
  body::after { right: var(--mar); }
  a { color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; font-size: 16px; color: var(--ink); }
  .top a { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  .top a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .top .pos { color: var(--muted); }
  button { height: 44px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--muted); font: 400 16px/1 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: -0.02em; cursor: pointer; }
  button:hover { color: var(--ink); }
  .label { font-size: 12px; line-height: 1.4; color: var(--muted); letter-spacing: 0; }

  main { max-width: 1680px; margin: 0 auto; }

  article { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 16px; margin-top: 56px; }
  article > * { grid-column: 1 / -1; min-width: 0; }
  .eyebrow { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); letter-spacing: 0; }
  h1 { margin: 12px 0 0; font-size: clamp(32px, 3.4vw, 48px); line-height: 1.2; font-weight: 350; letter-spacing: -0.03em; text-wrap: balance; }

  .sample { margin: 24px 0 0; padding: 0; font-size: 12px; line-height: 1.5; color: var(--muted); letter-spacing: 0; }
  .sample::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--ink); }
  @media (min-width: 900px) {
    .eyebrow { grid-row: 1; }
    h1 { grid-column: 1 / 7; grid-row: 2 / 5; margin-top: 12px; }
    .line, .note, .sample { grid-column: 7 / -1; max-width: none; }
    .line { grid-row: 2; margin-top: 12px; }
    .note { grid-row: 3; max-width: 30em; }
    .sample { grid-row: 4; }
    .note, .sample { align-self: start; }

  .cover { margin: 96px 0 0; max-width: 1280px; }
  .cover img { display: block; width: 100%; height: auto; background: var(--thumb); }
  .cover figcaption { margin-top: 12px; font-size: 12px; line-height: 1.4; color: var(--muted); letter-spacing: 0; }
    section { margin-top: 96px; border-top: 1px solid var(--line); padding-top: 12px; }
  h2 { margin: 0; font-size: 12px; line-height: 1.4; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  h2 small { font-size: 12px; font-weight: 400; margin-left: 8px; }
  .items { display: grid; grid-template-columns: repeat(24, 1fr); column-gap: 16px; row-gap: 56px; margin-top: 40px; align-items: start; }
  .item { grid-column: span 12; min-width: 0; }
  @media (min-width: 900px) {
    .item { grid-column: span 8; }
  }
  .item img { display: block; width: 100%; height: auto; background: var(--thumb); }
  .item h3 { margin: 14px 0 0; font-size: 20px; line-height: 1.3; font-weight: 350; letter-spacing: -0.03em; }
  .item .meta { margin: 2px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted); letter-spacing: 0; }

  ul.links { margin: 24px 0 0; padding: 0; list-style: none; }
  ul.links li a { display: inline-flex; align-items: center; min-height: 44px; font-size: clamp(22px, 2.2vw, 32px); line-height: 1.3; font-weight: 350; letter-spacing: -0.03em; text-decoration: none; }
  ul.links li a:hover { background: var(--accent); color: #000; }
  .empty { margin: 16px 0 0; color: var(--muted); }

  /* GNB — 메인·서브 공통 */
  .gnb { position: sticky; top: 0; z-index: 10; background: var(--ground); margin: 0 calc(var(--mar) * -1); padding: 0 var(--mar); }
  .gnb-in { max-width: 1680px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; }
  .brand { flex: none; font-size: 16px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  .weeks { margin-left: auto; display: flex; gap: 4px 20px; overflow-x: auto; scrollbar-width: none; }
  .weeks::-webkit-scrollbar { display: none; }
  .weeks a { flex: none; display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .weeks a:hover { color: var(--ink); }
  .weeks a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
  @media (max-width: 899px) { .weeks { order: 3; width: 100%; margin: 0 0 4px; } #theme { margin-left: auto; } }
  @media (min-width: 900px) { #theme { margin-left: 8px; } }
  @media (max-width: 639px) { .items { grid-template-columns: 1fr 1fr; } .item, body[data-week="4"] .item { grid-column: auto; } body[data-week="4"] .items { grid-template-columns: 1fr; } }
  .embed { margin: 96px 0 0; }
  .embed iframe { display: block; width: 100%; height: min(86vh, 920px); border: 0; background: var(--thumb); }
  .embed figcaption { margin-top: 12px; font-size: 12px; line-height: 1.4; color: var(--muted); letter-spacing: 0; }

  /* 마우스 인터랙션 레이어 — 모든 페이지 공통: 커서 링 · 이미지 틸트/패럴랙스 · 자석 링크 · 제목 패럴랙스 */
  .fx-cur { position: fixed; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 300; opacity: 0; transition: width .28s cubic-bezier(.2,.7,.2,1), height .28s cubic-bezier(.2,.7,.2,1), opacity .2s; will-change: transform; }
  .fx-cur.on { opacity: 1; }
  .fx-cur.hide { opacity: 0; }
  .fx-cur.link { width: 44px; height: 44px; }
  .fx-cur.big { width: 92px; height: 92px; }
  .fx-cur.down { width: 12px; height: 12px; }
  .fx-cur span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 11px/1 "Pretendard Variable", Pretendard, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #000; opacity: 0; transition: opacity .2s; }
  .fx-cur.big span { opacity: 1; }
  #name, .intro .line, h1#def { transition: translate .6s cubic-bezier(.2,.7,.2,1); }
  #name, h1#def { translate: calc(var(--mx, 0) * -10px) calc(var(--my, 0) * -7px); }
  .intro .line, .pin + .flow .line { translate: calc(var(--mx, 0) * 6px) calc(var(--my, 0) * 4px); }
  .item, .cover, .c .frame { transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .item img, .cover img { transition: translate .5s cubic-bezier(.2,.7,.2,1), scale .6s cubic-bezier(.2,.7,.2,1); }
  .fx-mag { transition: translate .35s cubic-bezier(.2,.7,.2,1); }
  .c:hover .frame { transform: translateY(-8px); }
  .c h2 { transition: translate .4s cubic-bezier(.2,.7,.2,1); }
  .c:hover h2 { translate: 8px 0; }
  @media (pointer: coarse), (prefers-reduced-motion: reduce) { .fx-cur { display: none; } #name, h1#def, .intro .line { translate: none; } }

  /* 임베드 페이지(9·10주): 제목 영역 없이 GNB 바로 아래부터 화면 전체를 임베드가 쓴다. 하단 목록 없음 */
  main { }
  body.embed-page { padding-bottom: 0; }
  body.embed-page::before, body.embed-page::after { display: none; }
  body.embed-page main { max-width: none; }
  body.embed-page article > :not(.embed) { display: none !important; }
  body.embed-page article { display: block; margin-top: 0; }
  body.embed-page .pn { display: none !important; }
  body.embed-page .embed { margin: 0 calc(var(--mar) * -1); }
  body.embed-page .embed iframe { height: calc(100vh - var(--gh, 56px)); height: calc(100dvh - var(--gh, 56px)); background: var(--ground); }
  body.embed-page .embed figcaption { display: none; }

  body.embed-page[data-week="9"] { --ground: #f6f8fa; --ink: #1e272d; --muted: #1e272d66; }
  body.embed-page[data-week="10"] { --ground: #ffffff; }

  /* 화면 바꾸기 버튼 삭제 */
  #theme { display: none !important; }

  /* GNB 메뉴: 하단 페이징 숫자와 같은 크기·서체(11px · 600 · 대문자), 영문 */
  .weeks a { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .weeks { gap: 4px 22px; }

  /* 화면 좌우 세로 라인 삭제 */
  body::before, body::after { display: none !important; }

  /* 하단 안내 문구(SCROLL · DRAG · ← →) 삭제 */
  .car-hint { display: none !important; }

  /* 로고(Sample Archive)를 GNB 메뉴와 같은 색으로 */
  .brand { color: var(--muted) !important; }
  body[data-week="11"].embed-page .gnb .brand { color: #ffffff !important; font-weight: 700; }

  /* 서브 공통: 설명 문구 진하게 · 마우스 포인터 원 파랑(인덱스와 동일) */
  .car-cap span { color: var(--ink) !important; }
  /* 파랑 포인터 원: 아래 글자가 항상 보이도록 블렌드 사용 (밝은 페이지 multiply · 어두운 5주·11주 screen) */
  .fx-cur { background: #2747b5 !important; mix-blend-mode: multiply !important; }
  .fx-cur span { color: #ffffff; }
  body[data-week="5"] .fx-cur, body[data-week="11"] .fx-cur { mix-blend-mode: screen !important; }
  body[data-week="7"] .car-cap span { color: #e1251b !important; }

  /* 로고(Sample Archive): GNB 우측 메뉴와 같은 서체 — 11px · 600 · 대문자 · 자간 .06em (모든 페이지 통일) */
  .brand, .gnb .brand, body[data-week] .gnb .brand { font-size: 11px !important; font-weight: 600 !important; text-transform: uppercase !important; letter-spacing: .06em !important; line-height: 1 !important; }
</style>
</head>

<div class="gnb" role="banner"><div class="gnb-in"><a class="brand" id="brand" href="../index.html">Name Archive</a><nav class="weeks" aria-label="주차"><a href="week-04.html">04 Gaze</a><a href="week-05.html">05 People</a><a href="week-06.html">06 Space</a><a href="week-07.html">07 Objects</a><a href="week-09.html">09 Words</a><a href="week-10.html" aria-current="page">10 Music</a><a href="week-11.html">11 Film</a></nav><button id="theme" type="button">화면 바꾸기</button></div><span id="pos" hidden></span></div>
<main>

    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="name"></h1>
    <p class="line" id="line"></p>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fail = (m) => { $("error").hidden = false; $("error").textContent = m; };
  const G = window.GALLERY;
  if (!G || !Array.isArray(G.cards)) { fail("data.js를 읽지 못했습니다. 한 단계 위 폴더의 data.js가 있는지, 쉼표 · 따옴표 · 괄호가 맞는지 확인하세요."); return; }
  const TOPIC = {"4": "시선", "5": "사람", "6": "공간", "7": "물건", "9": "문장", "10": "음악", "11": "영화"};
  const UNIT = {"4": "사진 묶음", "5": "고른 이유", "6": "머문 공간", "7": "매일 고르는 물건", "9": "아끼는 말", "10": "작업할 때 듣는 곡", "11": "영화 장면"};
  const week = document.body.dataset.week;
  const WEEKS = [4, 5, 6, 7, 9, 10, 11];
  const valid = G.cards.filter((c) => c && WEEKS.includes(Number(c.week)));
  const idx = valid.findIndex((c) => String(c.week) === week);
  if (idx < 0) { fail(week + "주 카드를 data.js에서 찾지 못했습니다. data.js의 cards에 week: " + week + " 가 있는지 확인하세요."); return; }
  const c = valid[idx];
  const safe = (h) => (h && !/^\s*(javascript|data|vbscript):/i.test(String(h))) ? String(h) : "";
  const isAbs = (p) => /^([a-z][a-z0-9+.-]*:|[/])/i.test(p);
  const rootPath = (p) => isAbs(p) ? p : "../" + p;
  const pad = (w) => String(w ?? "").padStart(2, "0");
  const name = String(c.name ?? "");
  document.title = name + " · " + (G.author ? G.author + " · " : "") + week + "주";
  $("pos").textContent = String(idx + 1).padStart(2, "0") + " / " + String(valid.length).padStart(2, "0");
  $("eyebrow").textContent = week + "주 · " + (TOPIC[week] || "");
  $("name").textContent = name;
  $("line").textContent = String(c.line ?? "");
  if (c.note) { $("note").hidden = false; $("note").textContent = String(c.note); }
  if (G.sampleNotice) { $("sample").hidden = false; $("sample").textContent = String(G.sampleNotice); }
  const A = c.archive && typeof c.archive === "object" ? c.archive : {};
  const picture = (src, alt) => {
    const s = safe(src); if (!s) return null;
    const im = document.createElement("img"); im.src = rootPath(s); im.alt = String(alt ?? ""); im.loading = "lazy";
    im.addEventListener("error", () => { const p = document.createElement("p"); p.className = "miss"; p.textContent = "이미지를 찾지 못했습니다: " + s + " (data.js의 경로와 images 폴더의 파일 이름을 맞춥니다)"; im.replaceWith(p); });
    return im;
  };
  let filled = 0;
  const cov = A.cover && typeof A.cover === "object" ? A.cover : null;
  const coverImg = cov ? picture(cov.src, cov.caption || name) : null;
  if (coverImg) {
    $("cover").hidden = false; $("cover").appendChild(coverImg);
    if (cov.caption) { const cp = document.createElement("figcaption"); cp.textContent = String(cov.caption); $("cover").appendChild(cp); }
    filled++;
  }
  const items = (Array.isArray(A.items) ? A.items : []).filter((m) => m && (m.title || m.text || m.src)).slice(0, 15);
  if (items.length) {
    $("itemsBox").hidden = false;
    const h = $("itemsHead"); h.textContent = String(A.itemsLabel || UNIT[week] || "모은 것");
    const sm = document.createElement("small"); sm.textContent = items.length + "개"; h.appendChild(sm);
    items.forEach((m) => {
      const a = document.createElement("article"); a.className = "item";
      const im = picture(m.src, m.title || ""); if (im) a.appendChild(im);
      if (m.title) { const t = document.createElement("h3"); t.textContent = String(m.title); a.appendChild(t); }
      if (m.meta) { const t = document.createElement("p"); t.className = "meta"; t.textContent = String(m.meta); a.appendChild(t); }
      if (m.text) { const t = document.createElement("p"); t.className = "text"; t.textContent = String(m.text); a.appendChild(t); }
      $("items").appendChild(a);
    });
    filled++;
  }
  const opens = (Array.isArray(A.open) ? A.open : []).filter((o) => o && safe(o.href)).slice(0, 6);
  if (opens.length) {
    $("openBox").hidden = false;
    opens.forEach((o) => {
      const li = document.createElement("li"), a = document.createElement("a"), h = safe(o.href);
      a.href = rootPath(h); a.textContent = String(o.label || "열어 보기") + " →";
      if (/^https?:/i.test(h)) { a.target = "_blank"; a.rel = "noopener"; }
      li.appendChild(a); $("open").appendChild(li);
    });
    filled++;
  }
  if (!filled) $("empty").hidden = false;
  const nav = (el, o, label) => { if (!o) { el.style.visibility = "hidden"; return; } el.href = "week-" + pad(o.week) + ".html"; el.textContent = label.replace("{n}", String(o.name ?? "")); };
  const root = document.documentElement;
  const dark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  $("theme").addEventListener("click", () => { root.dataset.theme = dark() ? "light" : "dark"; });
  nav($("prev"), valid[idx - 1], "← {n}");
  nav($("next"), valid[idx + 1], "{n} →");
})();
</script>

function label(t){lab.textContent=t||"";}
addEventListener("mousemove",function(e){x=e.clientX;y=e.clientY;c.classList.add("on");
 root.style.setProperty("--mx",((e.clientX/innerWidth)*2-1).toFixed(3));root.style.setProperty("--my",((e.clientY/innerHeight)*2-1).toFixed(3));},{passive:true});
document.addEventListener("mouseleave",function(){c.classList.remove("on");});
addEventListener("mousedown",function(){c.classList.add("down");});addEventListener("mouseup",function(){c.classList.remove("down");});
(function loop(){cx+=(x-cx)*.22;cy+=(y-cy)*.22;c.style.transform="translate("+cx.toFixed(1)+"px,"+cy.toFixed(1)+"px) translate(-50%,-50%)";requestAnimationFrame(loop);})();
function state(e){var t=e.target;c.classList.remove("link","big","hide");
 if(!t.closest)return;
 if(t.closest("iframe,.frame")){c.classList.add("hide");return;}
 if(t.closest(".car-stage")){c.classList.add("big");label("Scroll");return;}
 if(t.closest(".lbx button")||t.closest("a,button")){c.classList.add("link");label("");return;}
 if(t.closest(".item img,.cover img,.flow img")){c.classList.add("big");label(W==="5"?"":(t.closest(".lbx")?"":"View"));return;}
}
document.addEventListener("mouseover",state);
/* 이미지 틸트 + 패럴랙스 */
function tilt(el){var img=el.querySelector("img");
 el.addEventListener("mousemove",function(e){var r=el.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;
  el.style.transition="transform .18s";el.style.transform="perspective(1000px) rotateY("+(nx*7).toFixed(2)+"deg) rotateX("+(-ny*7).toFixed(2)+"deg)";
  if(img){img.style.translate=(nx*-18).toFixed(1)+"px "+(ny*-18).toFixed(1)+"px";img.style.scale="1.06";}});
 el.addEventListener("mouseleave",function(){el.style.transition="";el.style.transform="";if(img){img.style.translate="";img.style.scale="";}});}
Array.prototype.forEach.call(document.querySelectorAll(".item,#cover"),tilt);
/* 자석 링크 */
function mag(el){el.classList.add("fx-mag");
 el.addEventListener("mousemove",function(e){var r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);el.style.translate=(dx*.28).toFixed(1)+"px "+(dy*.4).toFixed(1)+"px";});
 el.addEventListener("mouseleave",function(){el.style.translate="";});}
Array.prototype.forEach.call(document.querySelectorAll(".go,ul.links a"),mag);
})();</script>
</body>
</html>
